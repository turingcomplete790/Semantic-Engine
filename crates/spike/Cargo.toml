[package]
name = "spike"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Phase 1 spike (specs/003-engine-design-spike): measurement-only, never packaged"

[lib]
name = "spike"
path = "src/lib.rs"

[[bin]]
name = "spike-plugin"
path = "src/bin/spike-plugin.rs"

[[bin]]
name = "spike-bench"
path = "src/bin/spike-bench.rs"

[dependencies]
plugin = { path = "../plugin" }
engine = { path = "../engine" }
semantic-vocabulary = { path = "../semantic-vocabulary" }
stash-adapter = { path = "../stash-adapter", features = ["spike"] }
oxigraph = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
