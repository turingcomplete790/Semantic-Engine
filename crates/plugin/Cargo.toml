[package]
name = "plugin"
version = "0.1.0"
edition.workspace = true
description = "The Stash plugin executable (raw interface)"

[lib]
name = "plugin"
path = "src/lib.rs"

[[bin]]
name = "semantic-engine"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
stash-adapter = { path = "../stash-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
