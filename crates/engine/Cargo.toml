[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
description = "Semantic engine library: versions, server identity, and (later) the semantic graph"

[dependencies]
oxigraph = "0.4"
uuid = { version = "1", features = ["v4"] }
semantic-vocabulary = { path = "../semantic-vocabulary" }
stash-adapter = { path = "../stash-adapter" }
serde_json = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
