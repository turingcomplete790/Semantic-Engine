name: Semantic Engine
description: Shared semantic engine for the Semantic Stash Viewer and semantic-tagging.
url: https://github.com/turingcomplete790/Semantic-Engine
version: 0.1.0
exec:
  - semantic-engine
interface: raw
errLog: error
tasks:
  - name: Generate server identifier
    description: Create this server's permanent identifier if it does not exist yet.
    defaultArgs:
      op: generateServerId
  - name: Apply relations
    description: Apply relations and their end roles to the scenes and images saved since the last run. Started by the save hook; safe to run by hand.
    defaultArgs:
      op: applyRelations
  - name: Re-apply relations
    description: Re-evaluate relations on every scene and image that can hold them, after editing rules, hierarchies, or Labels.
    defaultArgs:
      op: reapplyRelations
      scope: all
  - name: Build semantic graph
    description: Read the whole library and rebuild the semantic graph from it. The previous graph stays in use until the new one is published.
    defaultArgs:
      op: buildGraph
  - name: Update semantic graph
    description: Bring the semantic graph up to date with what changed since the last build or update. Rebuilds in full when it has to.
    defaultArgs:
      op: updateGraph
hooks:
  - name: Record changes for the semantic engine
    description: Records saved tags, performers, scenes and images, and starts "Update semantic graph" and, for scenes and images, "Apply relations". Adds only a few milliseconds to a save.
    triggeredBy:
      - Tag.Create.Post
      - Tag.Update.Post
      - Tag.Destroy.Post
      - Tag.Merge.Post
      - Performer.Create.Post
      - Performer.Update.Post
      - Performer.Destroy.Post
      - Scene.Create.Post
      - Scene.Update.Post
      - Scene.Destroy.Post
      - Image.Create.Post
      - Image.Update.Post
      - Image.Destroy.Post
    defaultArgs:
      op: recordChange
settings:
  serverId:
    displayName: Server identifier
    description: Generated once by the "Generate server identifier" task. Do not edit.
    type: STRING
