# Checks every change (spec 002 FR-013). Replaces the earlier vocabulary-only workflow.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lint, the full test suite, vocabulary and script checks.
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build and check tools
        # clang/libclang for the bundled RocksDB bindings; raptor2-utils for the second Turtle
        # parser; dash and busybox to run the POSIX install-script tests under strict shells.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev raptor2-utils dash busybox shellcheck
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The release package must carry no spike code (spec 003 FR-013) and no development
      # tools (spec 006: graph-bench; spec 005: reader-bench, fixture-capture).
      - name: Release package has no spike files or dev tools
        run: |
          scripts/package.sh --out dist
          if tar -tzf dist/semantic-engine-*.tar.gz | grep -E 'spike-plugin|semantic-engine-spike|graph-bench|reader-bench|fixture-capture'; then
            echo "error: the release package contains spike files or development tools" >&2
            exit 1
          fi
      # V014 passes with a notice until the first snapshot exists.
      - run: cargo run --locked -p semantic-vocabulary --bin vocab-check
      - run: scripts/validate-ttl.sh vocabulary
      - run: shellcheck -s sh scripts/*.sh scripts/tests/*.sh
      - run: TEST_SHELL=dash dash scripts/tests/install_sh_test.sh
      - run: TEST_SHELL="busybox sh" busybox sh scripts/tests/install_sh_test.sh
      - run: pwsh -NoProfile -File scripts/tests/install_ps1_test.ps1

  # The bundled RocksDB and the plugin must build and pass tests on every packaged OS.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - run: cargo test --workspace --locked
      - name: PowerShell install-script tests
        shell: pwsh
        run: ./scripts/tests/install_ps1_test.ps1
