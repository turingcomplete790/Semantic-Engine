name: vocabulary
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install raptor2-utils (second parser)
        run: sudo apt-get update && sudo apt-get install -y raptor2-utils
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p semantic-vocabulary
      # V014 passes with a notice until the first snapshot exists
      - run: cargo run -p semantic-vocabulary --bin vocab-check
      - run: scripts/validate-ttl.sh vocabulary
